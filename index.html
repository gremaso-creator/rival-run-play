<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101115">
<title>Rival Run</title>
<style>
:root{color-scheme:dark;--gold:#ffba46;--ink:#101115;--muted:#abb4c3}
*{box-sizing:border-box}
body{min-height:100vh;min-height:100svh;margin:0;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:radial-gradient(ellipse at 85% 9%,#393022,transparent 52%),linear-gradient(148deg,#1b202b,#101115 64%);color:#f4f7fb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,570px);padding:clamp(20px,5vw,42px);background:#131720;border:1px solid #414959;border-radius:18px;box-shadow:0 24px 60px #0007;position:relative;overflow:hidden}
main::before{content:"";position:absolute;top:0;left:0;width:100%;height:5px;background:repeating-linear-gradient(120deg,var(--gold) 0 15px,#292632 15px 26px)}
.kicker,.version{color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:clamp(2.4rem,12vw,5.2rem);font-style:italic;line-height:.94;letter-spacing:-.09em;margin:18px 0 8px}
h1 em{color:var(--gold)}
p{color:var(--muted);line-height:1.5;margin:0 0 24px}
a{color:inherit;text-decoration:none}
.play,summary{display:block;padding:13px 15px;border-radius:7px;font-weight:850;text-align:center}
.play{color:#211609;background:linear-gradient(110deg,#ffcc75,var(--gold));border-bottom:3px solid #9e6017}
details{margin-top:10px}
summary{cursor:pointer;background:#222a38;border:1px solid #435066;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +";color:var(--gold)}
details[open] summary::after{content:" −"}
ol{list-style:none;margin:9px 0 0;padding:0;display:grid;gap:5px}
.race{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 10px;border-radius:6px;background:#1c2432;font-size:.9rem}
.race-number{color:var(--gold);font-weight:850}
.locked{color:#a0a8b5;background:#181d27}
.locked small{margin-left:auto}
a:focus-visible,summary:focus-visible{outline:2px solid white;outline-offset:2px}
footer{margin-top:20px;color:var(--muted);font-size:.81rem;line-height:1.5}
</style>
</head>
<body>
<main>
  <header><span class="kicker">400 m drag racing</span><span class="version">v9.3</span></header>
  <h1>RIVAL <em>RUN</em></h1>
  <p>One Golf R. Six rivals. Win to unlock the next race.</p>
  <a class="play" id="play" href="race.html">Play</a>
  <details>
    <summary>Select race</summary>
    <ol id="races"></ol>
  </details>
  <footer>Alternate A / D, ← / →, or the two tap pads to accelerate.</footer>
</main>
<script>
const rivals=[
  'Honda Civic Type R',
  'Subaru WRX STI',
  'Ford Mustang GT',
  'Dodge Challenger SRT Hellcat',
  'Ferrari F8 Tributo',
  'Lamborghini Huracán EVO'
];
function renderMenu(){
  let unlocked=0;
  try{
    const saved=parseInt(localStorage.getItem('rr-sleeper-build'),10)||0;
    unlocked=Math.max(0,Math.min(rivals.length-1,saved));
  }catch{}
  const play=document.getElementById('play');
  play.textContent=unlocked?'Continue · Stage '+(unlocked+1):'Play';
  play.href='race.html?stage='+(unlocked+1);
  const rows=rivals.map((rival,index)=>{
    const entry=document.createElement('li');
    const available=index<=unlocked;
    const row=document.createElement(available?'a':'div');
    row.className=available?'race':'race locked';
    if(available)row.href='race.html?stage='+(index+1);
    const number=document.createElement('span');
    number.className='race-number';
    number.textContent=String(index+1).padStart(2,'0');
    row.append(number,rival);
    if(!available){
      const lock=document.createElement('small');
      lock.textContent='Locked';
      row.append(lock);
    }
    entry.append(row);
    return entry;
  });
  document.getElementById('races').replaceChildren(...rows);
}
window.addEventListener('pageshow',renderMenu);
</script>
</body>
</html>
