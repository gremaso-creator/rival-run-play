<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101115">
<title>Rival Run</title>
<style>
:root{color-scheme:dark;--gold:#ffba46;--muted:#abb4c3}
*{box-sizing:border-box}
body{margin:0;color:#f4f7fb;background:#101115;font-family:system-ui,sans-serif}
[hidden]{display:none!important}
main{min-height:100svh;padding:clamp(20px,5vw,72px);background:radial-gradient(ellipse at 76% 35%,#433320,transparent 55%),linear-gradient(150deg,#1b202b,#101115 70%)}
header{border-top:4px solid var(--gold);padding-top:18px}
.kicker,.version,figcaption{color:var(--muted);font-size:.75rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.version{float:right}
h1{font-size:clamp(3.6rem,14vw,12rem);font-style:italic;line-height:.86;letter-spacing:-.09em;margin:16px 0 28px}
h1 em{color:var(--gold)}
.layout{display:grid;grid-template-columns:minmax(230px,320px) minmax(0,1fr);gap:clamp(24px,6vw,100px);align-items:center}
nav{display:grid;gap:9px}
a,button,summary{color:inherit;font:inherit}
a{text-decoration:none}
.action,summary,.music{display:block;padding:13px 16px;border:1px solid #435066;border-radius:8px;background:#222a38;font-weight:800;text-align:left;cursor:pointer}
.play{color:#211609;background:var(--gold);border-color:#db941f}
summary::marker{color:var(--gold)}
details>div,ol{margin:8px 0 0;padding:10px;background:#171c25;border-radius:8px}
ol{list-style:none;display:grid;gap:4px}
.race{display:grid;grid-template-columns:22px 68px 1fr;align-items:center;gap:7px;min-height:40px;padding:4px;background:#232b39;border-radius:5px;font-size:.8rem}
.race img{width:100%}
.race-number{color:var(--gold);font-weight:800}
.locked{color:var(--muted)}
.locked small{display:block}
.music{width:100%;margin:4px 0}
.music[aria-pressed=true]{border-color:var(--gold)}
figure{margin:0;min-width:0}
figure img{display:block;width:100%;max-height:48vh;object-fit:contain;filter:drop-shadow(0 16px 14px #000a)}
figcaption{margin-top:16px;text-align:center}
.car-panel img{width:100%}
p,footer{color:var(--muted)}
footer{margin-top:24px;font-size:.85rem}
:focus-visible{outline:2px solid white;outline-offset:3px}
@media(max-width:690px){.layout{grid-template-columns:1fr;gap:20px}figure{grid-row:1}figure img{max-height:24vh}h1{margin-bottom:20px}}
</style>
</head>

function renderMenu(){
  let unlocked=0;
  try{
    const saved=parseInt(localStorage.getItem('rr-sleeper-build'),10)||0;
    unlocked=Math.max(0,Math.min(rivals.length-1,saved));
  }catch{}
  const play=document.getElementById('play');
  play.href='race.html?stage='+(unlocked+1);
  const rows=rivals.map((rival,index)=>{
    const entry=document.createElement('li');
    const available=index<=unlocked;
    const row=document.createElement(available?'a':'div');
    row.className=available?'race':'race locked';
    if(available)row.href='race.html?stage='+(index+1);
    const number=document.createElement('span');
    number.className='race-number';
    number.textContent=String(index+1).padStart(2,'0');
    const image=document.createElement('img');
    image.src=rivalImages[index];
    image.alt='';
    const label=document.createElement('span');
    label.textContent=rival;
    row.append(number,image,label);
    if(!available){
      const lock=document.createElement('small');
      lock.textContent='Locked';
      label.append(lock);
    }
    entry.append(row);
    return entry;
  });
  document.getElementById('races').replaceChildren(...rows);
}
const musicButton=document.getElementById('menu-music');
const menuTrack=document.getElementById('menu-track');
const menu=document.getElementById('menu');
const exitScreen=document.getElementById('exit-screen');
const raceSound=document.getElementById('race-sound');
let soundEnabled=true;
let musicEnabled=true;
document.getElementById('exit').onclick=()=>{
  menu.hidden=true;
  exitScreen.hidden=false;
  syncMenuMusic();
  document.getElementById('return').focus();
};
document.getElementById('return').onclick=()=>{
  exitScreen.hidden=true;
  menu.hidden=false;
  syncMenuMusic();
  document.getElementById('play').focus();
};
function updateRaceSound(){
  raceSound.setAttribute('aria-pressed',String(soundEnabled));
}
raceSound.onclick=()=>{
  soundEnabled=!soundEnabled;
  try{localStorage.setItem('rr-sound',soundEnabled?'on':'off');}catch{}
  updateRaceSound();
};
function syncMenuMusic(){
  if(!musicEnabled||document.hidden||menu.hidden){
    menuTrack.pause();
    return;
  }
  menuTrack.play().catch(()=>{});
}
function updateMusicButton(){
  musicButton.setAttribute('aria-pressed',String(!menuTrack.paused));
}
menuTrack.addEventListener('play',updateMusicButton);
menuTrack.addEventListener('pause',updateMusicButton);
musicButton.addEventListener('click',()=>{
  musicEnabled=menuTrack.paused;
  try{localStorage.setItem('rr-music',musicEnabled?'on':'off');}catch{}
  syncMenuMusic();
});
document.addEventListener('visibilitychange',syncMenuMusic);
window.addEventListener('pagehide',()=>menuTrack.pause());
window.addEventListener('pageshow',()=>{
  renderMenu();
  try{
    musicEnabled=localStorage.getItem('rr-music')!=='off';
    soundEnabled=localStorage.getItem('rr-sound')!=='off';
  }catch{}
  updateRaceSound();
  syncMenuMusic();
});
</script>
